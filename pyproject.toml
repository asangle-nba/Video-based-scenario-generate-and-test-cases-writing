[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-scenario-gen"
version = "0.1.0"
description = "Generate test scenarios and test cases from video files using LLMs"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "google-generativeai>=0.5.0",
    "opencv-python-headless>=4.9.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
]

[project.scripts]
video-scenario-gen = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
